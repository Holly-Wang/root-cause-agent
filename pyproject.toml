[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "root-cause-agent"
version = "0.1.0"
description = "自行实现核心 Harness 的受控 Python 根因分析 Agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.11,<2"]

[project.scripts]
rca-agent = "rca_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["rca_agent*"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["rca_agent", "tests"]
